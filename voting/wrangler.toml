name = "award-voting"
pages_build_output_dir = "public"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "voting"
database_id = "REPLACE_WITH_YOUR_D1_ID"   # printed by: wrangler d1 create voting

[vars]
# ISO 8601 with offset. Leave empty to disable the window check.
VOTING_OPENS  = "2026-11-10T08:00:00+01:00"
VOTING_CLOSES = "2026-11-17T23:59:00+01:00"
# "true" = voter must also type the email the link was sent to (stops forwarded links)
REQUIRE_EMAIL_CONFIRM = "true"
# Exact origin allowed to call the JSON API.
PUBLIC_ORIGIN = "https://vote.yourdomain.com"
