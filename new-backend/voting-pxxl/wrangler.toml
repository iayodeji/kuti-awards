name = "akoni-voting"
main = "worker/src/index.js"
compatibility_date = "2026-11-08"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/healthz", "/media/*"]

[[d1_databases]]
binding = "akoni_voting"
database_name = "akoni-voting"
database_id = "de9baeae-0402-4e4c-9665-63a1ffc80642"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "rkh-voting"

[vars]
VOTER_MODE = "device"
IP_BALLOT_CAP = "1000"
VOTING_OPENS = ""
VOTING_CLOSES = ""
R2_PREFIX = "nominees/"
TURNSTILE_SITE_KEY = "REPLACE_WITH_TURNSTILE_SITE_KEY"
